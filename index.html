<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五線譜視奏練習 (Sheet Music Reader)</title>
    <meta name="description" content="練習認識五線譜音符的網頁應用程式">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <h1>五線譜視奏練習</h1>
                <div class="score-board">
                    <div class="score-item correct">
                        <span class="label">答對</span>
                        <span class="value" id="score-correct">0</span>
                    </div>
                    <div class="score-item incorrect">
                        <span class="label">答錯</span>
                        <span class="value" id="score-incorrect">0</span>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <!-- Song Controls (hidden by default) -->
                <div id="song-controls" style="display: none; width: 100%; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: center; background: #eef5fc; padding: 1rem; border-radius: 8px; margin-top: 1rem;">
                    <label class="control-label">
                        <span>選擇樂曲：</span>
                        <select id="song-select"></select>
                    </label>
                    <label class="control-label">
                        <span>速度 (BPM)：</span>
                        <input type="number" id="bpm-input" style="width: 60px;" value="100">
                    </label>
                    <button id="song-play-btn" class="primary-btn" style="padding: 0.5rem 1rem;">▶️ 開始挑戰</button>
                    <button id="song-stop-btn" class="secondary-btn" style="padding: 0.5rem 1rem;" disabled>⏹ 停止</button>
                    <div id="song-score" style="font-weight: bold; color: var(--primary-color);">Combo: 0</div>
                </div>
                <label class="control-label">
                    <span>App 模式：</span>
                    <select id="app-mode-select">
                        <option value="practice">練習模式 (Practice)</option>
                        <option value="play">自由彈奏 (Play)</option>
                        <option value="song">樂曲挑戰 (Song Challenge)</option>
                    </select>
                </label>
                <div style="flex-basis: 100%; height: 0;"></div>
<div id="practice-controls" style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
                <label class="control-label">
                    <span>譜號：</span>
                    <select id="clef-select">
                        <option value="treble">高音譜 (Treble)</option>
                        <option value="bass">低音譜 (Bass)</option>
                        <option value="both">混合隨機 (Both)</option>
                    </select>
                </label>
                <label class="control-label checkbox-label">
                    <input type="checkbox" id="accidentals-checkbox" checked>
                    <span>包含升降記號</span>
                </label>
                <label class="control-label">
                    <span>題目長度：</span>
                    <select id="length-select">
                        <option value="single">單音 (Single)</option>
                        <option value="measure">一小節 (Measure)</option>
                    </select>
                </label>
                <div style="flex-basis: 100%; height: 0;"></div>
                <label class="control-label">
                    <span>題目類型：</span>
                    <select id="type-select">
                        <option value="single">單音符 (Note)</option>
                        <option value="chord">三和弦 (Triad)</option>
                    </select>
                </label>
                </div>
                <label class="control-label">
                    <span>作答介面：</span>
                    <select id="input-mode-select">
                        <option value="piano">鋼琴鍵盤 (Piano)</option>
                        <option value="guitar">吉他指板 (Guitar)</option>
                    </select>
                </label>
                <label class="control-label checkbox-label" id="show-notes-container">
                    <input type="checkbox" id="show-notes-checkbox" checked>
                    <span>顯示按鍵/指板音名</span>
                </label>
                <div class="header-buttons" style="margin-left: auto; display: flex; gap: 0.5rem;">
                    <a href="tutorial.html" target="_blank" class="secondary-btn" style="text-decoration: none;">🎓 樂理小教室</a>
                    <button id="cheat-sheet-btn" class="secondary-btn">📖 音符對照表</button>
                </div>
            </div>
        </header>

        <main>
            <div class="staff-card">
                <div class="staff-container" id="staff-container">
                    <!-- VexFlow will render here -->
                    <div id="playback-cursor" class="playback-cursor hidden"></div>
                </div>
                
                <div class="feedback-overlay" id="feedback-overlay">
                    <span class="feedback-text" id="feedback-text"></span>
                </div>
            </div>

            <div class="interaction-area">
                <div class="instruction">請問這是什麼音？</div>
                
                <div class="piano-wrapper" id="piano-wrapper">
                    <div class="piano-keyboard" id="piano-keyboard">
                        <!-- Octave 4 -->
                        <div class="piano-key white" data-note="C" data-accidental="n" data-octave="4"><span class="key-label">C4</span></div>
                        <div class="piano-key black c-sharp" data-note="C" data-accidental="#" data-octave="4"><span class="key-label">C♯</span></div>
                        <div class="piano-key white" data-note="D" data-accidental="n" data-octave="4"><span class="key-label">D4</span></div>
                        <div class="piano-key black d-sharp" data-note="D" data-accidental="#" data-octave="4"><span class="key-label">D♯</span></div>
                        <div class="piano-key white" data-note="E" data-accidental="n" data-octave="4"><span class="key-label">E4</span></div>
                        <div class="piano-key white" data-note="F" data-accidental="n" data-octave="4"><span class="key-label">F4</span></div>
                        <div class="piano-key black f-sharp" data-note="F" data-accidental="#" data-octave="4"><span class="key-label">F♯</span></div>
                        <div class="piano-key white" data-note="G" data-accidental="n" data-octave="4"><span class="key-label">G4</span></div>
                        <div class="piano-key black g-sharp" data-note="G" data-accidental="#" data-octave="4"><span class="key-label">G♯</span></div>
                        <div class="piano-key white" data-note="A" data-accidental="n" data-octave="4"><span class="key-label">A4</span></div>
                        <div class="piano-key black a-sharp" data-note="A" data-accidental="#" data-octave="4"><span class="key-label">A♯</span></div>
                        <div class="piano-key white" data-note="B" data-accidental="n" data-octave="4"><span class="key-label">B4</span></div>
                        
                        <!-- Octave 5 -->
                        <div class="piano-key white" data-note="C" data-accidental="n" data-octave="5"><span class="key-label">C5</span></div>
                        <div class="piano-key black c-sharp-5" data-note="C" data-accidental="#" data-octave="5"><span class="key-label">C♯</span></div>
                        <div class="piano-key white" data-note="D" data-accidental="n" data-octave="5"><span class="key-label">D5</span></div>
                        <div class="piano-key black d-sharp-5" data-note="D" data-accidental="#" data-octave="5"><span class="key-label">D♯</span></div>
                        <div class="piano-key white" data-note="E" data-accidental="n" data-octave="5"><span class="key-label">E5</span></div>
                        <div class="piano-key white" data-note="F" data-accidental="n" data-octave="5"><span class="key-label">F5</span></div>
                        <div class="piano-key black f-sharp-5" data-note="F" data-accidental="#" data-octave="5"><span class="key-label">F♯</span></div>
                        <div class="piano-key white" data-note="G" data-accidental="n" data-octave="5"><span class="key-label">G5</span></div>
                        <div class="piano-key black g-sharp-5" data-note="G" data-accidental="#" data-octave="5"><span class="key-label">G♯</span></div>
                        <div class="piano-key white" data-note="A" data-accidental="n" data-octave="5"><span class="key-label">A5</span></div>
                        <div class="piano-key black a-sharp-5" data-note="A" data-accidental="#" data-octave="5"><span class="key-label">A♯</span></div>
                        <div class="piano-key white" data-note="B" data-accidental="n" data-octave="5"><span class="key-label">B5</span></div>
                    </div>
                </div>

                <div class="guitar-fretboard-wrapper hidden" id="guitar-wrapper">
                    <div class="guitar-fretboard" id="guitar-fretboard">
                        <!-- Fretboard generated via JS -->
                    </div>
                </div>
            </div>
            
            <div class="history-area" id="history-area">
                <h2>歷史紀錄 (History)</h2>
                <div class="history-list" id="history-list">
                    <!-- History items will be inserted here dynamically -->
                </div>
            </div>
        </main>
        
        <!-- Cheat Sheet Modal -->
        <div class="start-overlay hidden" id="cheat-sheet-overlay">
            <div class="start-modal" style="max-width: 600px;">
                <h2>音符對照表</h2>
                <div class="controls" style="justify-content: center; width: 100%; box-shadow: none; padding: 0.5rem; margin-bottom: 0;">
                    <label class="control-label">
                        <span>譜號：</span>
                        <select id="cheat-sheet-clef">
                            <option value="treble">高音譜 (Treble)</option>
                            <option value="bass">低音譜 (Bass)</option>
                        </select>
                    </label>
                    <label class="control-label">
                        <span>記號：</span>
                        <select id="cheat-sheet-accidental">
                            <option value="n">自然音 (Natural)</option>
                            <option value="#">升記號 (Sharp)</option>
                            <option value="b">降記號 (Flat)</option>
                        </select>
                    </label>
                </div>
                <div class="cheat-sheet-wrapper" style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0;">
                    <div id="cheat-sheet-staff" style="min-width: 600px; display: flex; justify-content: center; padding-bottom: 10px;">
                        <!-- VexFlow cheat sheet will render here -->
                    </div>
                </div>
                <button id="close-cheat-sheet-btn" class="primary-btn">關閉</button>
            </div>
        </div>

        <!-- History Review Modal -->
        <div class="start-overlay hidden" id="history-review-overlay">
            <div class="start-modal" style="max-width: 400px;">
                <h2 id="history-review-title">歷史紀錄檢視</h2>
                <div class="staff-container" id="history-review-staff" style="margin: 1rem 0;">
                    <!-- VexFlow history review will render here -->
                </div>
                <div class="history-review-details" id="history-review-details" style="font-size: 1.125rem; font-weight: bold; margin-bottom: 1rem; color: var(--text-primary);">
                </div>
                <button id="close-history-review-btn" class="primary-btn">關閉 (Close)</button>
            </div>
        </div>
        
        <!-- Start screen for Audio Context -->
        <div class="start-overlay" id="start-overlay">
            <div class="start-modal">
                <div class="modal-icon">🎵</div>
                <h2>歡迎來到五線譜視奏練習</h2>
                <p>準備好挑戰您的讀譜速度了嗎？<br>我們將會發出琴聲，請確保您的音量已開啟。</p>
                <button id="start-app-btn" class="primary-btn">開始練習</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="songs.js"></script>
    <script src="app.v34.js"></script>
</body>
</html>
